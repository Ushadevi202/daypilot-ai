spring.application.name=daypilot

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/daypilot}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# The database structure is controlled only by Flyway. Hibernate just checks it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
server.port=8080

# Session cookie hardening
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Set to true when the site runs on HTTPS (production)
server.servlet.session.cookie.secure=false
server.servlet.session.timeout=7d

