spring.application.name=daypilot

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/daypilot}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# The database structure is controlled only by Flyway. Hibernate just checks it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
server.port=8080